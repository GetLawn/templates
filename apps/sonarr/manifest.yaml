id: sonarr
name: Sonarr
tagline: Smart TV show collection manager
description: |
  Sonarr monitors television series you select and coordinates searches and file handling through compatible services. It can send results to a configured download client, rename completed files, and organize your media library.

  **Monitor your library:**
  Follow selected series, view upcoming releases on a calendar, and track files that match the quality profiles you configure.

  **Works with your download client:**
  Sonarr connects to popular download managers like NZBGet, SABnzbd, qBittorrent, and Transmission. It sends downloads automatically and moves finished files into your media library.

  **Beautiful, organized library:**
  Episodes are automatically renamed and sorted into season folders using your preferred naming format. Metadata and artwork is fetched automatically so Jellyfin or Plex can display your library beautifully.

  **Quality upgrades:**
  Sonarr can replace an existing file when a configured source finds a version that better matches your quality profile.
