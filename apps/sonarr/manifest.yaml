id: sonarr
name: Sonarr
tagline: Smart TV show collection manager
description: |
  Sonarr automatically finds, downloads, and organizes your TV shows. Tell it which shows you follow, and it handles the rest — searching, downloading new episodes as they air, and keeping your library neatly organized.

  **Never miss an episode:**
  Sonarr monitors your shows and automatically downloads new episodes the moment they're available. Your library stays up to date without any manual effort.

  **Works with your download client:**
  Sonarr connects to popular download managers like NZBGet, SABnzbd, qBittorrent, and Transmission. It sends downloads automatically and moves finished files into your media library.

  **Beautiful, organized library:**
  Episodes are automatically renamed and sorted into season folders using your preferred naming format. Metadata and artwork is fetched automatically so Jellyfin or Plex can display your library beautifully.

  **Quality upgrades:**
  Already have a show but want a better quality version? Sonarr can automatically upgrade episodes to higher resolutions when they become available.
