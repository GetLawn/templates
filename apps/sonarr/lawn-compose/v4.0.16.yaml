x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16.2944-ls303
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./config:/config"
      - "./tv:/tv"
      - "./downloads:/downloads"
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
        - id: media-paths
          style: info
          elements:
            - id: root-folder-info
              type: text
        - id: download-client
          style: info
          elements:
            - id: download-client-info
              type: text
      healthChecks:
        - id: sonarr-api
          type: http
          path: /ping
          expectedStatus: 200
      environment:
        PUID:
        PGID:
        TZ:
