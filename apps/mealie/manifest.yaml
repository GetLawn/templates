id: mealie
name: Mealie
tagline: Self-hosted recipe manager and meal planner
description: |
  Mealie is a personal recipe manager. Import recipes from supported websites, plan your meals for the week, and automatically create shopping lists from a clean, easy-to-use interface.

  **Import recipes by URL:**
  Paste a URL from a supported recipe website and Mealie can import its ingredients, instructions, and photos.

  **Plan your meals:**
  Use the built-in meal planner to organize breakfast, lunch, and dinner for the entire week. Drag and drop recipes to rearrange your plan.

  **Shopping lists that write themselves:**
  Generate a shopping list from your meal plan with one click. Items are organized by category so you can breeze through the store.

  **Your recipes, your data:**
  Your recipe library lives on your Mac. Recipe websites can still see import requests, and any services you connect receive the data needed for their features.
symbolFallback: fork.knife
iconURL: https://getlawn.app/images/apps/mealie.png
category: Utilities
compatibility:
  minLawnVersion: 0.2.0
tags:
  - recipes
  - cooking
  - meal-planning
  - shopping-list
features:
  - Import recipes from supported websites by URL
  - Meal planning with drag-and-drop calendar
  - Automatic shopping list generation
  - Organize recipes into cookbooks and categories
  - Full-text search across all recipes
  - Mobile-friendly web interface
  - Multi-user support with household groups
  - Recipe sharing and public links
