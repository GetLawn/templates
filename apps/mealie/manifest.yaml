id: mealie
name: Mealie
tagline: Self-hosted recipe manager and meal planner
description: |
  Mealie is your personal recipe manager. Save recipes from any website with one click, plan your meals for the week, and automatically create shopping lists — all from a clean, easy-to-use interface.

  **Save recipes from anywhere:**
  Paste a URL from any recipe website and Mealie will automatically import the recipe with ingredients, instructions, and photos. No more copying and pasting or losing track of bookmarks.

  **Plan your meals:**
  Use the built-in meal planner to organize breakfast, lunch, and dinner for the entire week. Drag and drop recipes to rearrange your plan.

  **Shopping lists that write themselves:**
  Generate a shopping list from your meal plan with one click. Items are organized by category so you can breeze through the store.

  **Your recipes, your data:**
  Everything stays on your Mac. No cloud accounts, no subscriptions, no ads. Your family recipes are safe and private.
