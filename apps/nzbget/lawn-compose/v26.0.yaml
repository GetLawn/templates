x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  nzbget:
    image: nzbgetcom/nzbget:v26.0
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./config:/config"
      - "./downloads:/downloads"
    ports:
      - "6789:6789"
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: default-credentials
          style: info
          elements:
            - id: username
              type: field
              value: nzbget
            - id: password
              type: field
              value: tegbzn6789
            - id: change-credentials
              type: text
      healthChecks:
        - id: web-ui
          type: http
          path: /
          expectedStatus: 401
      environment:
        TZ:
