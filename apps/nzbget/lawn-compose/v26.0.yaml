x-lawn-compatibility:
  minLawnVersion: 0.2.0

services:
  nzbget:
    image: nzbgetcom/nzbget:v26.0
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./config:/config"
      - "./downloads:/downloads"
    ports:
      - "6789:6789"
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: default-credentials
          title: Default Credentials
          style: info
          elements:
            - type: field
              label: Username
              value: nzbget
            - type: field
              label: Password
              value: tegbzn6789
            - type: text
              content: "Change these in **Settings > Security** after your first login."
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /
          expectedStatus: 401
      environment:
        TZ:
          description: "Timezone for NZBGet (e.g. America/New_York)."
