id: nzbget
name: NZBGet
tagline: High-performance Usenet downloader
description: |
  NZBGet is a fast, lightweight Usenet download client that retrieves files from news servers you configure. It supports NZB files, RSS feeds, and integrations with automation tools such as Sonarr and Radarr.

  **Fast and Efficient:**
  Written in C++ for maximum performance, NZBGet uses very little CPU and memory. It downloads, verifies, repairs, and extracts files automatically — no manual steps needed.

  **Easy to Use:**
  The clean web interface lets you manage downloads, configure news servers, and monitor progress from any browser. Drag and drop NZB files or set up RSS feeds for automated downloading.

  **Built for Automation:**
  NZBGet integrates seamlessly with popular media management tools. It handles post-processing including par-check, repair, and archive extraction out of the box.
