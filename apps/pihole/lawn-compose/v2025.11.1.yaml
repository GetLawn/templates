x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Admin Password"
      description: "Password for the Pi-hole admin dashboard. Auto-generated during install."

services:
  pihole:
    image: pihole/pihole:2025.11.1
    environment:
      TZ: "${TIMEZONE:-UTC}"
      FTLCONF_webserver_api_password: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      FTLCONF_dns_listeningMode: "all"
      # Relocate databases from /etc/pihole to /data/pihole so they persist
      # on a volume. The databases live in a subdirectory of the mount (not the
      # root) so that the gravity script's chmod on the parent dir succeeds.
      FTLCONF_files_database: "/data/pihole/pihole-FTL.db"
      FTLCONF_files_gravity: "/data/pihole/gravity.db"
      FTLCONF_files_macvendor: "/data/pihole/macvendor.db"
      PIHOLE_UID: "0"
      PIHOLE_GID: "0"
      DNSMASQ_USER: "root"
    volumes:
      - "./data:/data"
    ports:
      - "80:80/tcp"
      - "53:53/tcp"
      - "53:53/udp"
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      createDirectories:
        - "./data/pihole"
      notices:
        - id: login-credentials
          title: Login Credentials
          style: info
          elements:
            - type: field
              label: Password
              source: FTLCONF_webserver_api_password
              container: pihole
      healthChecks:
        - type: http
          description: Admin dashboard is accessible
          path: /admin/
          expectedStatus: 200
      environment:
        TZ:
          description: "Timezone for log display and rotation (e.g. America/New_York)."
        FTLCONF_webserver_api_password:
          description: "Password for the Pi-hole admin dashboard. Auto-generated during install."
        FTLCONF_dns_listeningMode:
          description: "DNS listening mode. Must be 'all' for container networking."
        FTLCONF_files_database:
          description: "Path to the FTL long-term database. Relocated to /data/pihole for virtiofs compatibility."
        FTLCONF_files_gravity:
          description: "Path to the gravity (blocklist) database. Relocated to /data/pihole for virtiofs compatibility."
        FTLCONF_files_macvendor:
          description: "Path to the MAC vendor lookup database. Relocated to /data/pihole for virtiofs compatibility."
        PIHOLE_UID:
          description: "Override UID for the pihole user. Set to 0 to run as root for virtiofs compatibility."
        PIHOLE_GID:
          description: "Override GID for the pihole group. Set to 0 to run as root for virtiofs compatibility."
        DNSMASQ_USER:
          description: "User running the FTL DNS engine. Set to root for virtiofs compatibility."
