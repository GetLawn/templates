x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
    DNS_PROVIDER:
      value: cloudflare
      weight: 10
      options:
        cloudflare:
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
        google:
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_upstreams: "8.8.8.8;8.8.4.4"
        quad9:
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_upstreams: "9.9.9.9;149.112.112.112"
        opendns:
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_upstreams: "208.67.222.222;208.67.220.220"
    DNSSEC_VALIDATION:
      inputType: boolean
      value: false
      weight: 20
      options:
        "true":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_dnssec: "true"
        "false":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_dnssec: "false"
    BLOCKING_BEHAVIOR:
      value: "NULL"
      weight: 30
      options:
        "NULL":
          weight: 10
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_blocking_mode: "NULL"
        "NXDOMAIN":
          weight: 20
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_blocking_mode: "NXDOMAIN"
        "NODATA":
          weight: 30
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_blocking_mode: "NODATA"
        "IP":
          weight: 40
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_blocking_mode: "IP"
        "IP_NODATA_AAAA":
          weight: 50
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_blocking_mode: "IP_NODATA_AAAA"
    QUERY_HISTORY:
      inputType: boolean
      value: true
      weight: 40
      options:
        "true":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_queryLogging: "true"
        "false":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_dns_queryLogging: "false"
    PRIVACY_MODE:
      value: "0"
      weight: 50
      options:
        "0":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_misc_privacylevel: "0"
        "1":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_misc_privacylevel: "1"
        "2":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_misc_privacylevel: "2"
        "3":
          compose:
            services:
              pihole:
                environment:
                  FTLCONF_misc_privacylevel: "3"

services:
  pihole:
    image: pihole/pihole:2025.11.1
    environment:
      TZ: "${TIMEZONE:-UTC}"
      FTLCONF_webserver_api_password: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      FTLCONF_dns_listeningMode: "all"
      # Relocate databases from /etc/pihole to /data/pihole so they persist
      # on a volume. The databases live in a subdirectory of the mount (not the
      # root) so that the gravity script's chmod on the parent dir succeeds.
      FTLCONF_files_database: "/data/pihole/pihole-FTL.db"
      FTLCONF_files_gravity: "/data/pihole/gravity.db"
      FTLCONF_files_macvendor: "/data/pihole/macvendor.db"
      PIHOLE_UID: "0"
      PIHOLE_GID: "0"
      DNSMASQ_USER: "root"
    volumes:
      - "./data:/data"
    ports:
      - "80:80/tcp"
      - "53:53/tcp"
      - "53:53/udp"
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      createDirectories:
        - "./data/pihole"
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: password
              type: field
              source: FTLCONF_webserver_api_password
              container: pihole
      healthChecks:
        - id: admin-dashboard
          type: http
          path: /admin/
          expectedStatus: 200
      environment:
        TZ:
        FTLCONF_webserver_api_password:
        FTLCONF_dns_listeningMode:
        FTLCONF_files_database:
        FTLCONF_files_gravity:
        FTLCONF_files_macvendor:
        PIHOLE_UID:
        PIHOLE_GID:
        DNSMASQ_USER:
