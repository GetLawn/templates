id: pihole
name: Pi-hole
tagline: Network-wide ad blocking
description: |
  Pi-hole is a DNS-based ad blocker that protects every device on your network. Instead of installing ad blockers on each device, Pi-hole blocks ads and trackers at the network level before they even reach your devices.

  **Block ads everywhere:**
  Ads are blocked on all devices connected to your network — phones, tablets, smart TVs, and IoT devices — without installing anything on them. Even in-app ads that traditional browser extensions can't touch.

  **Lightweight and fast:**
  Pi-hole handles millions of DNS queries with minimal resources. Your browsing actually gets faster because ad content is never downloaded in the first place.

  **Detailed analytics:**
  See exactly what's happening on your network with a beautiful dashboard. Track how many queries are blocked, which domains are most requested, and which devices are the chattiest.

  **Your network, your rules:**
  Maintain full control with custom blocklists and whitelists. Block specific domains, allow exceptions for sites you trust, and fine-tune blocking behavior to your needs.
