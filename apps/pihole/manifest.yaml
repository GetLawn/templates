tags:
  - dns
  - ad-blocking
  - privacy
  - network
features:
  - Network-wide ad and tracker blocking
  - Beautiful admin dashboard with analytics
  - Works on configured devices without client software
  - Custom blocklists and whitelists
  - Detailed query logging and statistics
  - DHCP server built-in
  - Supports community and custom domain blocklists
  - Lightweight — runs with minimal resources
