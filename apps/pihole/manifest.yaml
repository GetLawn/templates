id: pihole
name: Pi-hole
tagline: Network-wide ad blocking
description: |
  Pi-hole is a DNS filtering service for your network. Configure your router or individual devices to use it, and requests matching your selected blocklists can be stopped before those domains load.

  **Filter requests across devices:**
  DNS filtering works across configured phones, tablets, computers, smart TVs, and other devices without browser extensions. It cannot remove ads served from the same domains as the content you use.

  **Lightweight and fast:**
  Pi-hole handles DNS queries with modest resource usage. Blocking selected domains can reduce unnecessary network requests and page load work.

  **Detailed analytics:**
  See exactly what's happening on your network with a beautiful dashboard. Track how many queries are blocked, which domains are most requested, and which devices are the chattiest.

  **Your network, your rules:**
  Maintain full control with custom blocklists and whitelists. Block specific domains, allow exceptions for sites you trust, and fine-tune blocking behavior to your needs.
symbolFallback: checkmark.shield.fill
iconURL: https://getlawn.app/images/apps/pihole.svg
category: Networking
compatibility:
