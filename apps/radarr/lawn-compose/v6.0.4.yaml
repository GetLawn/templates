x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./config:/config"
      - "./movies:/movies"
      - "./downloads:/downloads"
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
        - id: media-paths
          style: info
          elements:
            - id: root-folder-info
              type: text
        - id: download-client
          style: info
          elements:
            - id: download-client-info
              type: text
      healthChecks:
        - id: radarr-api
          type: http
          path: /ping
          expectedStatus: 200
      environment:
        PUID:
        PGID:
        TZ:
