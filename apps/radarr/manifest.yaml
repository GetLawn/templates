id: radarr
name: Radarr
tagline: Automated movie collection manager
description: |
  Radarr monitors films you select and coordinates searches and file handling through compatible services. It can send results to a configured download client, rename completed files, and organize your media library.

  **Monitor Your Library:**
  Follow selected films, review upcoming releases on a calendar, and track files that match the quality profiles you configure.

  **Smart Quality Control:**
  Set up quality profiles for resolution, codecs, and other file characteristics. Radarr can replace an existing file when a configured source finds a version that better matches your preferences.

  **Works With Your Setup:**
  Connects to popular download clients like NZBGet, SABnzbd, qBittorrent, and Transmission. Integrates seamlessly with Jellyfin to keep your media server library current.

  **Beautiful Library View:**
  Browse your collection with poster grids, calendar views, or tables. Track missing movies, see what's downloading, and manage your entire library from one interface.

  **Part of the *arr Stack:**
  Radarr is the movie companion to Sonarr for television series. Together with a download client and media server, they can coordinate monitoring and library organization.
