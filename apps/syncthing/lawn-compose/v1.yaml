x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  syncthing:
    image: syncthing/syncthing:1
    environment:
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      STGUIADDRESS: "http://0.0.0.0:8384"
    volumes:
      - "./data:/var/syncthing"
    ports:
      - "8384:8384"
      - "22000:22000"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: ["CMD", "curl", "-fkLsS", "-m", "2", "http://127.0.0.1:8384/rest/noauth/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
      healthChecks:
        - id: web-ui
          type: http
          path: /rest/noauth/health
          expectedStatus: 200
      environment:
        PUID:
        PGID:
        STGUIADDRESS:
