# This template intentionally uses the "latest" image tag. The itzg/minecraft-server
# container is a runtime wrapper — the actual Minecraft server JAR is downloaded at
# startup based on the VERSION env var. Pinning the container image risks bundling an
# outdated Java version (e.g. Java 21) while Minecraft requires a newer one (Java 25+).
# Using "latest" ensures the Java runtime stays current as Minecraft bumps requirements.
services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TZ: "${TIMEZONE:-UTC}"
      VERSION: "LATEST"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE}"
      VIEW_DISTANCE: "${VIEW_DISTANCE}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION}"
      SEED: "${SEED}"
      LEVEL: "${LEVEL}"
    volumes:
      - "./data:/data"
    ports:
      - "25565:25565"
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 8
    deploy:
      resources:
        limits:
          memory: 2048M
    x-lawn:
      notices:
        - id: connect-info
          style: info
          elements:
            - id: connection-info
              type: text
      environment:
        EULA:
        TZ:
        VERSION:
x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    DIFFICULTY:
      value: easy
      weight: 10
      options:
        peaceful:
          compose:
            services:
              minecraft:
                environment:
                  DIFFICULTY: peaceful
        easy:
          compose:
            services:
              minecraft:
                environment:
                  DIFFICULTY: easy
        normal:
          compose:
            services:
              minecraft:
                environment:
                  DIFFICULTY: normal
        hard:
          compose:
            services:
              minecraft:
                environment:
                  DIFFICULTY: hard
    HARDCORE:
      inputType: boolean
      value: false
      weight: 20
      options:
        "true":
          compose:
            services:
              minecraft:
                environment:
                  HARDCORE: "TRUE"
        "false":
          compose:
            services:
              minecraft:
                environment:
                  HARDCORE: "FALSE"
    PVP:
      inputType: boolean
      value: true
      weight: 30
      options:
        "true":
          compose:
            services:
              minecraft:
                environment:
                  PVP: "TRUE"
        "false":
          compose:
            services:
              minecraft:
                environment:
                  PVP: "FALSE"
    MODE:
      value: survival
      weight: 40
      options:
        survival:
          compose:
            services:
              minecraft:
                environment:
                  MODE: survival
        creative:
          compose:
            services:
              minecraft:
                environment:
                  MODE: creative
        adventure:
