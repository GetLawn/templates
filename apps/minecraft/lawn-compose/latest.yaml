      value: true
      weight: 70
      options:
        "true":
          compose:
            services:
              minecraft:
                environment:
                  ALLOW_NETHER: "TRUE"
        "false":
          compose:
            services:
              minecraft:
                environment:
                  ALLOW_NETHER: "FALSE"
    SPAWN_ANIMALS:
      inputType: boolean
      value: true
      weight: 80
      options:
        "true":
          compose:
            services:
              minecraft:
                environment:
                  SPAWN_ANIMALS: "TRUE"
        "false":
          compose:
            services:
              minecraft:
                environment:
                  SPAWN_ANIMALS: "FALSE"
    SPAWN_MONSTERS:
      inputType: boolean
      value: true
      weight: 90
      options:
        "true":
          compose:
            services:
              minecraft:
                environment:
                  SPAWN_MONSTERS: "TRUE"
        "false":
          compose:
            services:
              minecraft:
                environment:
                  SPAWN_MONSTERS: "FALSE"
    SPAWN_NPCS:
      inputType: boolean
      value: true
      weight: 100
      options:
