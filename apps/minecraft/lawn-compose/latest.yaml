    FORCE_GAMEMODE:
      inputType: boolean
      value: false
      weight: 50
      options:
        "true":
          compose:
            services:
              minecraft:
                environment:
                  FORCE_GAMEMODE: "TRUE"
        "false":
          compose:
            services:
              minecraft:
                environment:
                  FORCE_GAMEMODE: "FALSE"
    ENABLE_COMMAND_BLOCK:
      inputType: boolean
      value: false
      weight: 60
      options:
