id: minecraft
name: Minecraft Server
tagline: Run your own Minecraft Java Edition server for friends and family
description: |
  Minecraft Server lets you host your own private Minecraft Java Edition server right on your Mac. Invite friends, build together, and play on your own terms — no monthly subscription, no third-party hosting required.

  **Your world, your rules:**
  Configure the game difficulty, enable or disable PvP, set a custom world name, and control who can join. With whitelist support, only the players you approve can connect.

  **Choose a server version:**
  Run the current Minecraft Java Edition release or pin a specific supported version to keep your world stable.

  **Multiple server flavors:**
  Start with Vanilla for the pure Minecraft experience, or switch to Paper for better performance and plugin support. Forge and Fabric are also available for modded play.

  **Your world is safe:**
  World data, player data, and server settings are stored in Lawn's persistent app data so routine server updates preserve your world. Keep separate backups before major version or mod changes.

  **How to connect:**
  After starting the server, use the connection address Lawn displays. Other players on your local network must use your Mac's network address rather than `localhost`.
