id: navidrome
name: Navidrome
tagline: Your personal music streaming server
description: |
  Navidrome is a lightweight, self-hosted music server that lets you stream your entire music collection from any browser or phone. Think of it as your own personal Spotify, but with music you already own.

  **Stream Your Music Anywhere:**
  Access your music library from any web browser, or use one of many compatible mobile apps for iOS and Android. Navidrome supports CarPlay and Android Auto, so your music goes wherever you do.

  **Works With Your Collection:**
  Point Navidrome at your existing music folder and it handles the rest. It supports virtually every audio format and automatically organizes your library with album art, artist info, and metadata.

  **Multi-User Support:**
  Each family member gets their own account with personal playlists, favorites, play history, and listening statistics. Share your music library without sharing your taste.

  **Light on Resources:**
  Navidrome is designed to run on minimal hardware. It uses an embedded database, so there's nothing extra to set up or maintain.
