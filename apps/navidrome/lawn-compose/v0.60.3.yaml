x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  navidrome:
    image: deluan/navidrome:0.60.3
    environment:
      ND_MUSICFOLDER: "/music"
      ND_DATAFOLDER: "/data"
      ND_SCANNER_SCHEDULE: "0 */12 * * *"
    volumes:
      - "./data:/data"
      - "./music:/music:ro"
    ports:
      - "4533:4533"
    healthcheck:
      test: ["CMD", "wget", "-nv", "-t1", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
      healthChecks:
        - id: web-ui
          type: http
          path: /ping
          expectedStatus: 200
      environment:
        ND_MUSICFOLDER:
        ND_DATAFOLDER:
        ND_SCANNER_SCHEDULE:
