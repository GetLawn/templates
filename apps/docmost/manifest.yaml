features:
  - Real-time collaborative editing
  - Spaces for organizing content by team or project
  - Nested pages with full-text search
  - Diagrams with Draw.io, Excalidraw, and Mermaid
  - Page history and version tracking
  - Granular permission controls
  - File attachments and embeds
  - 10+ language support
