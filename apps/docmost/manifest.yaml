id: docmost
name: Docmost
tagline: Open-source collaborative wiki and documentation
description: |
  A powerful, real-time collaborative wiki and documentation platform — a self-hosted alternative to Confluence and Notion.

  **Write together, in real time:**
  Multiple people can edit the same page simultaneously. No more "someone else is editing this file" messages. Changes appear live as your team types.

  **Organize your knowledge:**
  Structure your docs with Spaces — separate areas for different teams or projects. Pages can be nested, linked, and tagged for easy navigation.

  **Rich editing experience:**
  Beyond just text: embed diagrams with Draw.io, Excalidraw, or Mermaid charts. Add tables, code blocks, images, and attachments. Include content from services like Airtable, Loom, and more.

  **Your data, your rules:**
  Your workspace lives on your Mac and does not require a hosted Docmost subscription. External embeds and integrations still connect to the services that provide them.
