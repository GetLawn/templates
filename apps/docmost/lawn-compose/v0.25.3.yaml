x-lawn-compatibility:
  minLawnVersion: 0.2.0

x-lawn:
  variables:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Database Password"
      description: "PostgreSQL password. Auto-generated during install."
    SECRET_KEY:
      source: generatedSecret
      length: 50
      displayName: "Secret Key"
      description: "Secret key for session and token security. Auto-generated during install."

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # PGDATA must be a subdirectory of the mount point so postgres can
      # create it with correct ownership (postgres user, not host user)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "docmost"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:
        POSTGRES_DB:
          description: "Name of the PostgreSQL database used by Docmost."
        POSTGRES_USER:
          description: "PostgreSQL username for Docmost."
        PGDATA:
          description: "Data directory inside the container. Do not change."

  redis:
    # Note: No volume mount - Redis is used for real-time collaboration and task
    # queues, not document storage. Active sessions are lost on restart, but all
    # documents and user data are safe in PostgreSQL.
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docmost:
    image: docmost/docmost:0.25.3
    depends_on:
      - postgres
      - redis
    environment:
      APP_URL: "${LAWN_URL:-http://localhost:${HOST_PORT_3000:-3000}}"
      APP_SECRET: "${SECRET_KEY:?SECRET_KEY is required}"
      DATABASE_URL: "postgresql://docmost:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/docmost"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - "./storage:/app/data/storage"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      notices:
        - id: first-time-setup
          title: First-Time Setup
          style: info
          elements:
            - type: text
              content: "On first visit, you'll complete a brief setup to create your admin account."
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /
          expectedStatus: 200
          intervalSeconds: 10
          timeoutSeconds: 10
          retries: 5
          startPeriodSeconds: 60
      environment:
        APP_URL:
          description: "Public URL of your Docmost instance. Auto-configured from mDNS hostname when available."
        APP_SECRET:
          description: "Secret key for session and token security. Auto-generated during install."
        DATABASE_URL:
          description: "PostgreSQL connection string. Auto-configured during install."
        REDIS_URL:
          description: "Redis connection URL for real-time collaboration and background jobs. Auto-configured during install."
