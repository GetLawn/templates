x-lawn-compatibility:
  minLawnVersion: 0.2.0

x-lawn:
  variables:
    SECRET_KEY:
      source: generatedSecret
      length: 50
      displayName: "Secret Key"
      description: "Secret key for encryption. Auto-generated during install."

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:14-rootless
    environment:
      FORGEJO__database__DB_TYPE: "sqlite3"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DOMAIN: "${LAWN_DOMAIN:-localhost}"
      FORGEJO__server__ROOT_URL: "${LAWN_URL:-http://localhost:${HOST_PORT_3000:-3000}}/"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
    volumes:
      - "./data:/var/lib/gitea"
      - "./config:/etc/gitea"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: first-time-setup
          title: First-Time Setup
          style: info
          elements:
            - type: text
              content: "On first visit, you'll see a registration page. The first registered user automatically becomes the administrator."
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /api/healthz
          expectedStatus: 200
      environment:
        FORGEJO__database__DB_TYPE:
          description: "Database engine. Set to sqlite3 for zero-configuration setup."
        FORGEJO__server__HTTP_PORT:
          description: "HTTP port for the web interface."
        FORGEJO__server__DOMAIN:
          description: "Domain name for the Forgejo server. Auto-configured from mDNS hostname when available."
        FORGEJO__server__ROOT_URL:
          description: "Full public URL of the Forgejo server. Auto-configured from mDNS hostname when available."
        FORGEJO__server__OFFLINE_MODE:
          description: "Disable external requests to CDNs and Gravatar."
        FORGEJO__security__INSTALL_LOCK:
          description: "Skip the installation wizard. Pre-configured for immediate use."
        FORGEJO__security__SECRET_KEY:
          description: "Secret key for encryption. Auto-generated during install."
        FORGEJO__service__DISABLE_REGISTRATION:
          description: "Whether to disable user self-registration."
        FORGEJO__service__REQUIRE_SIGNIN_VIEW:
          description: "Whether to require sign-in to view any page."
        FORGEJO__openid__ENABLE_OPENID_SIGNIN:
          description: "Enable OpenID sign-in."
        FORGEJO__openid__ENABLE_OPENID_SIGNUP:
          description: "Enable OpenID sign-up."
