x-lawn-compatibility:
  minLawnVersion: 0.2.0

x-lawn:
  variables:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Database Password"
      description: "Superuser password for the PostgreSQL instance."

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # PGDATA must be a subdirectory of the mount point so postgres can
      # create it with correct ownership (postgres user, not host user)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    x-lawn:
      notices:
        - id: login-credentials
          title: Connection Details
          style: info
          elements:
            - type: field
              label: Username
              value: postgres
            - type: field
              label: Password
              source: POSTGRES_PASSWORD
              container: postgres
            - type: field
              label: Database
              value: postgres
            - type: field
              label: Port
              value: "5432"
      environment:
        POSTGRES_DB:
          description: "Name of the default database created on first start."
        POSTGRES_USER:
          description: "Superuser name for the PostgreSQL instance."
        PGDATA:
          description: "Data directory inside the container. Do not change."
