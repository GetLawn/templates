id: affine
name: AFFiNE
tagline: The all-in-one workspace for your notes, docs, and plans
description: |
  An open-source workspace that combines a document editor, infinite whiteboard, and project management — all in one place. Think of it as a privacy-first alternative to Notion and Miro.

  **Write, draw, and plan together:**
  Switch seamlessly between a rich document editor and a freeform canvas. Place notes, diagrams, tables, and linked pages anywhere on the infinite board.

  **Your data, your Mac:**
  Everything stays on your computer. No subscription, no cloud account required — just a fast, local workspace that's always available offline.

  **Built for collaboration:**
  Real-time sync lets multiple people work on the same document simultaneously, whether over your local network or via a shared server.
icon: doc.richtext.fill
