features:
  - Infinite canvas whiteboard with freehand drawing
  - Rich document editor with tables, databases, and embeds
  - Kanban boards and project management views
  - Real-time multi-user collaboration
  - Offline-first with local data storage
  - AI writing assistant and slide generator
