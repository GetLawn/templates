x-lawn:
  compatibility:
    minLawnVersion: 0.6.1
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: affine
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # PGDATA must be a subdirectory of the mount point so postgres can
      # create it with correct ownership (postgres user, not host user)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "affine", "-d", "affine"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:

  redis:
    image: redis:7.4.7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  affine:
    image: ghcr.io/toeverything/affine:0.27.4
    depends_on:
      - postgres
      - redis
    # Configure Lawn's defaults before AFFiNE's required pre-deploy migrations.
    pre_start:
      - command: ["node", "/root/.affine/config/lawn-defaults.cjs"]
      - command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgresql://affine:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/affine"
      AFFINE_SERVER_PORT: "3010"
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - "./storage:/root/.affine/storage"
      - "./config:/root/.affine/config"
    ports:
      - "3010"
    deploy:
      resources:
        limits:
          memory: 2048M
    x-lawn:
      initFiles:
        - source: "lawn-defaults.cjs"
          containerPath: "/root/.affine/config/lawn-defaults.cjs"
      healthChecks:
        - id: web-ui
          type: http
          path: /
          expectedStatus: 200
          followRedirects: true
      environment:
        REDIS_SERVER_HOST:
        DATABASE_URL:
        AFFINE_SERVER_PORT:
        AFFINE_INDEXER_ENABLED:
