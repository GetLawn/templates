x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.32.1
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./config:/config"
      - "./metadata:/metadata"
      - "./audiobooks:/audiobooks"
      - "./podcasts:/podcasts"
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /healthcheck
          expectedStatus: 200
      environment:
        TZ:
          description: "Timezone for Audiobookshelf (e.g. America/New_York)."
