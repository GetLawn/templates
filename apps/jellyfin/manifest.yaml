id: jellyfin
name: Jellyfin
tagline: The free software media system
description: |
  Jellyfin is a free, open-source media server that lets you collect, manage, and stream your personal media library. Enjoy your movies, TV shows, music, and photos on any device.

  **Your Media, Your Way:**
  Organize your entire media collection in one place. Jellyfin automatically fetches artwork, descriptions, and metadata for your movies and TV shows, creating a beautiful library that's easy to browse.

  **Stream Anywhere:**
  Watch on your phone, tablet, TV, or computer. Jellyfin apps are available for Android, iOS, Roku, Fire TV, Apple TV, and more. Your media follows you wherever you go on your home network.

  **No Subscriptions, No Tracking:**
  Unlike Plex or Emby, Jellyfin is completely free with no premium tiers, no account requirements, and no usage tracking. Your viewing habits stay private.

  **Live TV & DVR:**
  Connect a TV tuner and watch live television through Jellyfin. Set up recordings and never miss your favorite shows.

  **Active Community:**
  Backed by a passionate open-source community with regular updates, new features, and a growing ecosystem of clients and plugins.
