x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./config:/config"
      - "./cache:/cache"
      - "./media:/media"
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2048M
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
        - id: media-library-path
          style: info
          elements:
            - id: library-setup-info
              type: text
      healthChecks:
        - id: jellyfin-api
          type: http
          path: /health
          expectedStatus: 200
      environment:
        TZ:
