x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
    SECRET_KEY:
      source: generatedSecret
      length: 50

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # PGDATA must be a subdirectory of the mount point so postgres can
      # create it with correct ownership (postgres user, not host user)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "linkwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - "./meilisearch:/meili_data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      environment:

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.13.5
    depends_on:
      - postgres
      - meilisearch
    environment:
      DATABASE_URL: "postgresql://linkwarden:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/linkwarden"
      NEXTAUTH_SECRET: "${SECRET_KEY:?SECRET_KEY is required}"
      NEXTAUTH_URL: "${LAWN_URL:-http://localhost:${HOST_PORT_3000:-3000}}/api/v1/auth"
      MEILI_MASTER_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      MEILI_HOST: "http://meilisearch:7700"
      NEXT_PUBLIC_DISABLE_REGISTRATION: "false"
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
    volumes:
      - "./data:/data/data"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 2048M
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
      healthChecks:
        - id: web-ui
          type: http
          path: /
          expectedStatus: 200
          intervalSeconds: 10
          timeoutSeconds: 10
          retries: 5
          startPeriodSeconds: 120
      environment:
        DATABASE_URL:
        NEXTAUTH_SECRET:
        NEXTAUTH_URL:
        MEILI_MASTER_KEY:
        MEILI_HOST:
        NEXT_PUBLIC_DISABLE_REGISTRATION:
        NEXT_PUBLIC_CREDENTIALS_ENABLED:
