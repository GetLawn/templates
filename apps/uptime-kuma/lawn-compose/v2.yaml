x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    EMBEDDING:
      inputType: boolean
      value: false
      weight: 10
      options:
        "true":
          compose:
            services:
              uptime-kuma:
                environment:
                  UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: "1"
        "false":
          compose:
            services:
              uptime-kuma:
                environment:
                  UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: ""
    WEBSOCKET_ORIGIN_CHECK:
      inputType: boolean
      value: false
      weight: 20
      options:
        "true":
          compose:
            services:
              uptime-kuma:
                environment:
                  UPTIME_KUMA_WS_ORIGIN_CHECK: "bypass"
        "false":
          compose:
            services:
              uptime-kuma:
                environment:
                  UPTIME_KUMA_WS_ORIGIN_CHECK: "cors-like"
    SELF_SIGNED_CERTIFICATES:
      inputType: boolean
      value: false
      weight: 30
      options:
        "true":
          compose:
            services:
              uptime-kuma:
                environment:
                  NODE_TLS_REJECT_UNAUTHORIZED: "0"
        "false":
          compose:
            services:
              uptime-kuma:
                environment:
                  NODE_TLS_REJECT_UNAUTHORIZED: "1"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    environment:
      TZ: "${TIMEZONE:-UTC}"
      UPTIME_KUMA_DB_TYPE: "sqlite"
    volumes:
      - "./data:/app/data"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: http
          path: /
          expectedStatus: 200
      environment:
        TZ:
        UPTIME_KUMA_DB_TYPE:
