x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    environment:
      TZ: "${TIMEZONE:-UTC}"
      UPTIME_KUMA_DB_TYPE: "sqlite"
    volumes:
      - "./data:/app/data"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /
          expectedStatus: 200
      environment:
        TZ:
          description: "Timezone for Uptime Kuma (e.g. America/New_York)."
        UPTIME_KUMA_DB_TYPE:
          description: "Database engine. Set to sqlite to skip the database selection wizard."
