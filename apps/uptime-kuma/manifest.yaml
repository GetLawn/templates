id: uptime-kuma
name: Uptime Kuma
tagline: A fancy self-hosted monitoring tool
description: |
  Uptime Kuma is an easy-to-use monitoring tool for websites, APIs, and services. Receive notifications through the channels you configure when a check detects a problem.

  **Monitor Different Services:**
  Track websites, APIs, TCP ports, DNS records, containers, and more. Configure check intervals based on how quickly you need to detect an outage and the load each check creates.

  **Instant Notifications:**
  Send alerts through supported services including Telegram, Discord, Slack, email, and Pushover. Delivery timing depends on the check interval and notification provider.

  **Beautiful Dashboard:**
  View all your monitors at a glance with a clean, responsive interface. See uptime percentages, response times, and incident history in real time.

  **Privacy First:**
  Monitor configuration and history are stored on your Mac. Monitored endpoints and notification providers receive the requests and alert data needed for the features you configure.
symbolFallback: chart.line.uptrend.xyaxis
iconURL: https://getlawn.app/images/apps/uptime-kuma.svg
category: Monitoring
compatibility:
  minLawnVersion: 0.2.0
tags:
  - monitoring
  - uptime
  - status-page
features:
  - Monitor HTTP(s), TCP, DNS, Docker, and more
  - 90+ notification services (Telegram, Discord, Slack, email)
  - Beautiful real-time dashboard with response time graphs
  - Public status pages for sharing with users
  - Multi-language support
  - Ping chart and certificate expiry monitoring
  - Two-factor authentication support
