x-lawn:
  compatibility:
    minLawnVersion: 0.6.0
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32

services:
  postgres:
    image: postgres:15.19-trixie
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:

  redis:
    image: redis:7.4.11-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:35.0.1-apache
    # Keep the image's setup, then start background jobs with this service's settings.
    entrypoint: [/bin/sh, /var/www/lawn-entrypoint.sh]
    command: [apache2-foreground]
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost${LAWN_DOMAIN:+ ${LAWN_DOMAIN}}"
      REDIS_HOST: redis
      LAWN_URL: "${LAWN_URL:-http://localhost}"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./www:/var/www"
    ports:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost/status.php"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              value: admin
            - id: password
              type: field
              source: NEXTCLOUD_ADMIN_PASSWORD
              container: nextcloud
      createDirectories:
        - "./www/html"
      initFiles:
        - source: "z-lawn-override.config.php"
          containerPath: "/var/www/html/config/z-lawn-override.config.php"
        - source: "check-migrations.php"
          containerPath: "/var/www/check-migrations.php"
        - source: "cron.sh"
          containerPath: "/var/www/lawn-cron.sh"
        - source: "run-jobs.php"
          containerPath: "/var/www/run-jobs.php"
        - source: "entrypoint.sh"
          containerPath: "/var/www/lawn-entrypoint.sh"
      migrationCheck:
        command: [php, /var/www/check-migrations.php]
        user: www-data
        interval: 30s
        timeout: 30s
        retries: 3
      environment:
        POSTGRES_HOST:
        POSTGRES_DB:
        POSTGRES_USER:
        NEXTCLOUD_ADMIN_USER:
        NEXTCLOUD_ADMIN_PASSWORD:
        NEXTCLOUD_TRUSTED_DOMAINS:
        REDIS_HOST:
        TZ:
