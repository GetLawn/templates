x-lawn-compatibility:
  minLawnVersion: 0.2.0

x-lawn:
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Database Password"
      description: "PostgreSQL password. Auto-generated during install."
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Admin Password"
      description: "Password for the initial admin account. Auto-generated during install."

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:
        POSTGRES_DB:
          description: "Name of the PostgreSQL database used by Nextcloud."
        POSTGRES_USER:
          description: "PostgreSQL username for Nextcloud."
        PGDATA:
          description: "Data directory inside the container. Do not change."

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:32
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost${LAWN_DOMAIN:+ ${LAWN_DOMAIN}}"
      REDIS_HOST: redis
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./www:/var/www"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost/status.php"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      notices:
        - id: login-credentials
          title: Login Credentials
          style: info
          elements:
            - type: field
              label: Username
              value: admin
            - type: field
              label: Password
              source: NEXTCLOUD_ADMIN_PASSWORD
              container: nextcloud
      createDirectories:
        - "./www/html"
      initFiles:
        - source: "z-lawn-override.config.php"
          containerPath: "/var/www/html/config/z-lawn-override.config.php"
      environment:
        POSTGRES_HOST:
          description: "Hostname of the PostgreSQL database server."
        POSTGRES_DB:
          description: "PostgreSQL database name."
        POSTGRES_USER:
          description: "PostgreSQL username."
        NEXTCLOUD_ADMIN_USER:
          description: "Username for the initial admin account."
        NEXTCLOUD_ADMIN_PASSWORD:
          description: "Password for the initial admin account. Auto-generated during install."
        NEXTCLOUD_TRUSTED_DOMAINS:
          description: "Space-separated list of domains allowed to access Nextcloud. Includes mDNS hostname when available."
        REDIS_HOST:
          description: "Hostname of the Redis cache server."
        TZ:
          description: "Timezone for Nextcloud (e.g. America/New_York)."
