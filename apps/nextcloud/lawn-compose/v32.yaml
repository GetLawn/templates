x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:32
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost${LAWN_DOMAIN:+ ${LAWN_DOMAIN}}"
      REDIS_HOST: redis
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./www:/var/www"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost/status.php"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              value: admin
            - id: password
              type: field
              source: NEXTCLOUD_ADMIN_PASSWORD
              container: nextcloud
      createDirectories:
        - "./www/html"
      initFiles:
        - source: "z-lawn-override.config.php"
          containerPath: "/var/www/html/config/z-lawn-override.config.php"
      environment:
        POSTGRES_HOST:
        POSTGRES_DB:
        POSTGRES_USER:
        NEXTCLOUD_ADMIN_USER:
        NEXTCLOUD_ADMIN_PASSWORD:
        NEXTCLOUD_TRUSTED_DOMAINS:
        REDIS_HOST:
        TZ:
