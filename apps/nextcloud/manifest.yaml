id: nextcloud
name: Nextcloud
tagline: Your own private cloud for files, calendars, and more
description: |
  Nextcloud is a self-hosted collaboration platform that gives you full control over your data. Store files, sync calendars and contacts, edit documents, and collaborate with others — all from your own Mac.

  **Your Files, Your Rules:**
  Replace Dropbox, Google Drive, and iCloud with your own private cloud. Access your files from any device through the web interface or sync them automatically with the desktop and mobile apps.

  **More Than File Storage:**
  Nextcloud supports apps for calendars, contacts, notes, and browser-based document editing. Some capabilities require additional Nextcloud apps or companion services.

  **Share With Confidence:**
  Share files and folders with password protection, expiration dates, and download limits. Data is sent to the users and any companion services you explicitly connect.

  **Privacy First:**
  Nextcloud stores its copy of your data on your Mac. Files also travel to the people, devices, apps, and external services you choose to connect, and available storage depends on your disk space.
