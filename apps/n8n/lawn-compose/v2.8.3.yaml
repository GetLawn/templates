x-lawn-compatibility:
  minLawnVersion: 0.2.0

x-lawn:
  config:
    SECRET_KEY:
      source: generatedSecret
      length: 50
      displayName: "Secret Key"
      description: "Encryption key for stored credentials. Auto-generated during install."

services:
  n8n:
    image: n8nio/n8n:2.8.3
    environment:
      GENERIC_TIMEZONE: "${TIMEZONE:-UTC}"
      N8N_ENCRYPTION_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: "${LAWN_URL:-}"
    volumes:
      - "./data:/home/node/.n8n"
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /healthz
          expectedStatus: 200
      environment:
        GENERIC_TIMEZONE:
          description: "Timezone for workflow scheduling and date display (e.g. America/New_York)."
        N8N_ENCRYPTION_KEY:
          description: "Encryption key for stored credentials. Auto-generated during install."
        N8N_SECURE_COOKIE:
          description: "Require HTTPS for authentication cookies. Disabled for local access."
        N8N_DIAGNOSTICS_ENABLED:
          description: "Send anonymous usage statistics to n8n. Disabled for privacy."
        N8N_PERSONALIZATION_ENABLED:
          description: "Show personalization survey on first login. Disabled for simpler setup."
        WEBHOOK_URL:
          description: "Public URL for webhook triggers. Auto-configured from mDNS hostname when available."
