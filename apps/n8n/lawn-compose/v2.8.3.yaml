x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    SECRET_KEY:
      source: generatedSecret
      length: 50

services:
  n8n:
    image: n8nio/n8n:2.8.3
    environment:
      GENERIC_TIMEZONE: "${TIMEZONE:-UTC}"
      N8N_ENCRYPTION_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: "${LAWN_URL:-}"
    volumes:
      - "./data:/home/node/.n8n"
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: http
          path: /healthz
          expectedStatus: 200
      environment:
        GENERIC_TIMEZONE:
        N8N_ENCRYPTION_KEY:
        N8N_SECURE_COOKIE:
        N8N_DIAGNOSTICS_ENABLED:
        N8N_PERSONALIZATION_ENABLED:
        WEBHOOK_URL:
