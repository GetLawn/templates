id: n8n
name: n8n
tagline: Workflow automation with native AI capabilities
description: |
  n8n is a visual workflow automation platform that connects your apps and services together. Build powerful automations without writing code — or add custom JavaScript and Python when you need it.

  **Visual Workflow Builder:**
  Design automations by dragging and connecting nodes on a canvas. Each node represents an action — send an email, update a spreadsheet, post to Slack, query a database, and hundreds more. No programming required.

  **AI-Powered Workflows:**
  Build intelligent automations using built-in AI nodes. Connect to ChatGPT, Claude, and other LLMs to create AI agents, summarize documents, classify data, or generate content — all within your workflows.

  **400+ Integrations:**
  Connect to popular services like Google Sheets, Slack, GitHub, Notion, Airtable, Stripe, and many more. Trigger workflows from webhooks, schedules, or events in your connected apps.

  **Self-Hosted and Private:**
  Your workflows, credentials, and data stay on your Mac. No cloud dependency, no usage limits, no subscriptions. Run as many workflows as you need.
