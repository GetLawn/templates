  - Share projects and assign tasks to others
  - Task reminders, labels, and file attachments
  - Import from Todoist, Trello, TickTick, and Microsoft To-Do
  - CalDAV support for Apple Calendar and Reminders
  - Repeating tasks and subtasks
  - Full-text search across all tasks
