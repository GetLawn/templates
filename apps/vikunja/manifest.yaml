id: vikunja
name: Vikunja
tagline: The open-source to-do app for everyone
description: |
  Vikunja is a beautiful, open-source task manager and project organizer. Think of it as your personal Todoist or Things 3 — but running entirely on your own Mac.

  **Organize the way you think:**
  View your tasks as a list, Kanban board, Gantt chart, or table. Switch between views with a click. Whether you prefer a simple to-do list or a full project timeline, Vikunja adapts to you.

  **Work alone or with others:**
  Create personal projects for yourself, or share them with family, friends, or teammates. Assign tasks, set due dates, add comments, and track who's doing what.

  **Stay on schedule:**
  Set reminders on tasks and Vikunja will notify you when it's time to act. Attach files, add labels, and use subtasks to break down complex work into manageable steps.

  **Bring your data with you:**
  Import supported data from Todoist, Trello, TickTick, or Microsoft To Do. Import completeness and duration depend on the source service and size of your workspace.

  **Your data, your rules:**
  Your Vikunja workspace lives on your Mac without a hosted subscription. People, calendar clients, and integrations you connect can access the task data you share with them.
