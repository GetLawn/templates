x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
    SECRET_KEY:
      source: generatedSecret
      length: 50

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vikunja
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # PGDATA must be a subdirectory of the mount point so postgres can
      # create it with correct ownership (postgres user, not host user)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vikunja", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    x-lawn:
      environment:

  vikunja:
    image: vikunja/vikunja:1.1.0
    depends_on:
      - db
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      VIKUNJA_SERVICE_JWTSECRET: "${SECRET_KEY:?SECRET_KEY is required}"
      VIKUNJA_SERVICE_PUBLICURL: "${LAWN_URL:-http://localhost:${HOST_PORT_3456:-3456}}/"
      VIKUNJA_SERVICE_TIMEZONE: "${TIMEZONE:-UTC}"
    volumes:
      - "./files:/app/vikunja/files"
    ports:
      - "3456:3456"
    x-lawn:
      notices:
        - id: first-time-setup
          style: info
          elements:
            - id: setup-info
              type: text
      healthChecks:
        - id: web-ui
          type: http
          path: /health
          expectedStatus: 200
          intervalSeconds: 15
          timeoutSeconds: 5
          retries: 5
          startPeriodSeconds: 30
      environment:
        VIKUNJA_DATABASE_TYPE:
        VIKUNJA_DATABASE_HOST:
        VIKUNJA_DATABASE_DATABASE:
        VIKUNJA_DATABASE_USER:
        VIKUNJA_DATABASE_PASSWORD:
        VIKUNJA_SERVICE_JWTSECRET:
        VIKUNJA_SERVICE_PUBLICURL:
        VIKUNJA_SERVICE_TIMEZONE:
