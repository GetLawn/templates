  - devops
features:
  - Git repository hosting with web interface
  - Pull requests with code review
  - Issue tracking and project boards
  - Built-in CI/CD with Gitea Actions
  - Package registry for containers, npm, and more
  - Wiki and documentation per repository
  - Lightweight — runs great on any Mac
