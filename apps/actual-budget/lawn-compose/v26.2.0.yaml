x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  actual-budget:
    image: docker.io/actualbudget/actual-server:26.2.0
    environment:
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./data:/data"
    ports:
      - "5006:5006"
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: http
          path: /health
          expectedStatus: 200
      environment:
        TZ:
