id: actual-budget
name: Actual Budget
tagline: A local-first personal finance app with envelope budgeting
description: |
  Actual Budget is a beautiful, fast personal finance tool built on envelope budgeting — the simple idea of giving every dollar a job. Track your spending, plan ahead, and take control of your money, all from the privacy of your own Mac.

  **Envelope Budgeting Made Simple:**
  Assign every dollar of income to a category — rent, groceries, savings, fun money. When a category runs out, you know it's time to stop spending. It's the easiest way to stay on top of your finances without spreadsheets or guesswork.

  **Lightning Fast and Offline-Ready:**
  Your budget data lives on your Mac first, not in the cloud. The app works without an internet connection, and the built-in server supports synchronization across your devices when you enable it.

  **Transaction Import:**
  Import transactions from your bank via OFX, QFX, or CSV files. Custom rules can categorize recurring transactions and reduce repetitive work.

  **Privacy First:**
  Your budget lives on your Mac, with no advertising or data mining. If you connect a bank-sync provider, that provider receives the account data needed to sync transactions.
