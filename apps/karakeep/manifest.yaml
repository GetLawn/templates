id: karakeep
name: Karakeep
tagline: Save and organize links, notes, and files
description: |
  Karakeep is a personal archive for links, notes, images, and files, with tools for finding saved material later.

  **Bookmark pages with one click:**
  Save a page, and Karakeep can fetch its title, description, and a screenshot. Browser extensions for Chrome and Firefox make it easy to save pages as you browse.

  **Find anything with AI-powered search:**
  Karakeep uses AI to automatically tag your saved content, so you can search by topic without manually organizing everything. Full-text search lets you find that article you saved months ago.

  **Keep references available:**
  Save pages locally to keep useful references available if the original website changes or goes offline.

  **Built for privacy:**
  Your bookmarks, notes, and archives live on your Mac. Websites can still see requests made while saving a page, and optional AI providers receive the content you ask them to process.
symbolFallback: bookmark.fill
iconURL: https://getlawn.app/images/apps/karakeep.svg
iconIsTemplate: true
category: Utilities
compatibility:
  minLawnVersion: 0.2.0
tags:
  - bookmarks
  - read-later
  - archiving
  - notes
  - ai
features:
  - Save links, notes, images, and files in one place
  - Automatic AI-powered tagging and organization
  - Full-text search across all saved content
  - Web page archiving with screenshots
  - Browser extension for Chrome and Firefox
  - Mobile apps for iOS and Android
  - RSS feed integration for automatic imports
  - Optional local AI with Ollama (no OpenAI account needed)
