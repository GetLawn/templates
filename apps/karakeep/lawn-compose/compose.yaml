x-lawn:
  compatibility:
    minLawnVersion: 0.6.0
  config:
    SECRET_KEY:
      source: generatedSecret
      length: 50
    DISABLE_SIGNUPS:

services:
  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    environment:
      MEILI_MASTER_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - "./meilisearch:/meili_data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      environment:

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
    deploy:
      resources:
        limits:
          memory: 512M

  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    depends_on:
      - meilisearch
      - chrome
    environment:
      DATA_DIR: /data
      MEILI_ADDR: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      BROWSER_WEB_URL: "http://chrome:9222"
      NEXTAUTH_SECRET: "${SECRET_KEY:?SECRET_KEY is required}"
      NEXTAUTH_URL: "${LAWN_URL:-http://localhost:3000}"
      DB_WAL_MODE: "true"
      DISABLE_SIGNUPS: "${DISABLE_SIGNUPS:-false}"
    volumes:
      - "./data:/data"
    ports:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1024M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: http
          path: /api/auth/providers
          expectedStatus: 200
          intervalSeconds: 15
          timeoutSeconds: 10
          retries: 5
          startPeriodSeconds: 60
      notices:
        - id: first-run-signup
          style: info
          elements:
            - id: first-run-info
              type: text
        - id: disable-signups
          style: info
          visibleWhen:
            variable: DISABLE_SIGNUPS
            value: "false"
            container: karakeep
          elements:
            - id: disable-registration-info
              type: text
            - id: disable-action
              type: variableAction
              variable: DISABLE_SIGNUPS
              container: karakeep
              value: "true"
      environment:
        DATA_DIR:
        MEILI_ADDR:
        MEILI_MASTER_KEY:
        BROWSER_WEB_URL:
        NEXTAUTH_SECRET:
        NEXTAUTH_URL:
        DB_WAL_MODE:
        DISABLE_SIGNUPS:
