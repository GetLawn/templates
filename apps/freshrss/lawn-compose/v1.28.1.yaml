x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
    ADMIN_API_PASSWORD:
      source: generatedSecret
      length: 32
    REFRESH_SCHEDULE:
      inputType: select
      value: twice-hourly
      weight: 10
      options:
        disabled:
          weight: 10
          compose:
            services:
              freshrss:
                environment:
                  CRON_MIN: ""
        hourly:
          weight: 20
          compose:
            services:
              freshrss:
                environment:
                  CRON_MIN: "17"
        twice-hourly:
          weight: 30
          compose:
            services:
              freshrss:
                environment:
                  CRON_MIN: "13,43"
        every-twenty-minutes:
          weight: 40
          compose:
            services:
              freshrss:
                environment:
                  CRON_MIN: "*/20"

services:
  freshrss:
    image: freshrss/freshrss:1.28.1
    environment:
      TZ: "${TIMEZONE:-UTC}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      ADMIN_API_PASSWORD: "${ADMIN_API_PASSWORD:?ADMIN_API_PASSWORD is required}"
      CRON_MIN: "13,43"
      FRESHRSS_ENV: production
      FRESHRSS_INSTALL: "--api-enabled --base-url ${LAWN_URL:-http://localhost:${HOST_PORT_80:-80}} --default-user admin --language en"
      FRESHRSS_USER: "--api-password ${ADMIN_API_PASSWORD:?ADMIN_API_PASSWORD is required} --language en --password ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required} --user admin"
    volumes:
      - "./data:/var/www/FreshRSS/data"
      - "./extensions:/var/www/FreshRSS/extensions"
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "cli/health.php"]
      interval: 75s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              value: admin
            - id: password
              type: field
              source: ADMIN_PASSWORD
              container: freshrss
            - id: api-password
              type: field
              source: ADMIN_API_PASSWORD
              container: freshrss
            - id: api-password-info
              type: text
      healthChecks:
        - id: web-ui
          type: http
          path: /api/
          expectedStatus: 200
      environment:
        TZ:
        CRON_MIN:
        ADMIN_PASSWORD:
        ADMIN_API_PASSWORD:
        FRESHRSS_ENV:
        FRESHRSS_INSTALL:
        FRESHRSS_USER:
