id: github-actions-runner
name: GitHub Actions Runner
tagline: Run your GitHub Actions workflows on your own hardware
description: |
  Run CI/CD workflows on your Mac instead of a GitHub-hosted runner, with direct control over the local environment, tools, and resources.

  **Your Hardware, Your Speed:**
  Jobs execute using your Mac's CPU and memory instead of a shared GitHub-hosted runner. Queueing and concurrency remain subject to your runner capacity and GitHub configuration.

  **Docker Support:**
  Enable Docker inside the runner to use Docker-based actions, `docker run`, and `docker compose` in workflows. The runner starts its own Docker daemon inside Lawn's isolated Linux environment.

  **Stays Registered:**
  Runner registration persists across restarts. The runner reconnects to GitHub automatically without re-registering each time it starts.

  **Repo and Org Runners:**
  Register as a repository runner for a specific project, or as an organization runner to handle jobs across all your repos. Both modes are supported.

  **Private Builds:**
  Build and test repositories on hardware you control instead of a third-party build worker. GitHub still coordinates each job and receives the logs, statuses, and artifacts your workflow sends back.
symbolFallback: terminal.fill
iconURL: https://getlawn.app/images/apps/github-actions-runner.svg
category: Development
compatibility:
  minLawnVersion: 0.4.0
tags:
  - ci-cd
  - github
  - automation
  - devops
  - runner
features:
  - Run GitHub Actions workflows on your Mac's hardware
  - Support for repository and organization runners
  - Docker support for container-based workflow steps when enabled
  - Persists runner registration across restarts
  - Customizable labels for targeting specific runners in workflow YAML
  - Compatible with GitHub.com and GitHub Enterprise Server
