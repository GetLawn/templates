x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    RUNNER_TOKEN:
      source: userProvided
    REPO_URL:
      source: userProvided
    ORG_NAME:
      source: userProvided

services:
  runner:
    image: myoung34/github-runner:2.331.0-ubuntu-focal
    environment:
      RUNNER_TOKEN: "${RUNNER_TOKEN}"
      REPO_URL: "${REPO_URL}"
      ORG_NAME: "${ORG_NAME}"
      RUNNER_SCOPE: "repo"
      LABELS: "self-hosted,linux"
      RUNNER_NAME_PREFIX: "lawn"
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: "/runner/data"
      RUNNER_WORKDIR: "/_work"
      DISABLE_AUTO_UPDATE: "true"
      UNSET_CONFIG_VARS: "true"
      START_DOCKER_SERVICE: "false"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./data:/runner/data"
    deploy:
      resources:
        limits:
          memory: 4G
    x-lawn:
      notices:
        - id: github-credentials-required
          style: warning
          elements:
            - id: token-instructions
              type: text
            - id: setup-guide
              type: text
      environment:
        RUNNER_SCOPE:
        LABELS:
        RUNNER_NAME_PREFIX:
        CONFIGURED_ACTIONS_RUNNER_FILES_DIR:
        RUNNER_WORKDIR:
        DISABLE_AUTO_UPDATE:
        UNSET_CONFIG_VARS:
        START_DOCKER_SERVICE:
        TZ:
