id: bentopdf
name: BentoPDF
tagline: Privacy-first PDF toolkit with 50+ tools, all processed in your browser
description: |
  BentoPDF is a comprehensive PDF toolkit that processes files locally in your browser instead of uploading them to the BentoPDF server. No account or subscription is required for the self-hosted app.

  **50+ PDF Tools:**
  Merge, split, compress, rotate, crop, reorder pages, extract images, add watermarks, headers and footers, and much more. Everything you need for day-to-day PDF work is included.

  **Edit and Convert:**
  Annotate PDFs with highlights, comments, and signatures. Convert from 30+ formats including Word, Excel, PowerPoint, images (JPG, PNG, HEIC), EPUB, Markdown, and HTML. Convert PDFs back to those same formats.

  **Complete Privacy:**
  Document processing happens locally in your browser using WebAssembly. As with any software handling sensitive files, protect access to your Mac and browser session and review any external resources you choose to load.

  **Works Offline:**
  Once loaded, the core tools work without internet access. Advanced features (OCR, compression) download processing libraries the first time they're used, then work offline afterward.

  **Workflow Builder:**
  Automate repetitive PDF tasks with the visual node-based workflow builder. Chain tools together to create custom processing pipelines for documents you handle regularly.
