id: vaultwarden
name: Vaultwarden
tagline: A lightweight, self-hosted password manager compatible with Bitwarden
description: |
  Vaultwarden is an unofficial, self-hosted server compatible with Bitwarden clients. It lets you store and synchronize passwords, payment cards, identities, and secure notes across your devices.

  **All Your Passwords, One Place:**
  Store passwords, payment cards, identities, and secure notes within your configured limits and available storage. Access them from supported Bitwarden clients or the web vault.

  **Secure by Design:**
  Your vault is encrypted end-to-end with AES-256 — not even your server can read your data. Enable two-factor authentication with TOTP, FIDO2/WebAuthn, or YubiKey for extra protection.

  **Share Securely:**
  Create organizations to share passwords with family or team members. Use collections to organize shared credentials and control who can access what.

  **Bitwarden Send:**
  Securely share text or files with anyone using time-limited, encrypted links. Set access limits and optional passwords for extra control.

  **Privacy First:**
  Encrypted vault data lives on your Mac without Bitwarden's hosted service. Vaultwarden sends it only to the clients and integrations you connect.
symbolFallback: lock.shield
iconURL: https://getlawn.app/images/apps/vaultwarden.svg
iconIsTemplate: true
category: Utilities
compatibility:
  minLawnVersion: 0.2.0
tags:
  - passwords
  - security
  - bitwarden
  - encryption
features:
  - Password, card, identity, and secure-note storage
  - Compatible with official Bitwarden apps and extensions
  - End-to-end AES-256 encryption
  - Two-factor authentication (TOTP, FIDO2, YubiKey)
  - Organizations and collections for password sharing
  - Bitwarden Send for secure file and text sharing
  - Built-in admin panel for server management
  - Lightweight — runs great on minimal hardware
