  - Compatible with all official Bitwarden apps and extensions
  - End-to-end AES-256 encryption
  - Two-factor authentication (TOTP, FIDO2, YubiKey)
  - Organizations and collections for password sharing
  - Bitwarden Send for secure file and text sharing
  - Built-in admin panel for server management
  - Lightweight — runs great on minimal hardware
