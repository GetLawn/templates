x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    SECRET_KEY:
      source: generatedSecret
      length: 50

services:
  vaultwarden:
    image: vaultwarden/server:1.35.3
    environment:
      TZ: "${TIMEZONE:-UTC}"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN: "${SECRET_KEY:?SECRET_KEY is required}"
      DOMAIN: "${LAWN_URL:-}"
    ports:
      - "80:80"
    volumes:
      - "./data:/data"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    x-lawn:
      notices:
        - id: admin-token
          style: info
          elements:
            - id: admin-token
              type: field
              source: ADMIN_TOKEN
              container: vaultwarden
            - id: admin-panel-info
              type: text
        - id: disable-signups
          style: warning
          elements:
            - id: registration-warning
              type: text
        - id: self-signed-cert
          style: info
          elements:
            - id: cert-info
              type: text
      environment:
        TZ:
        SIGNUPS_ALLOWED:
        ADMIN_TOKEN:
        DOMAIN:

  caddy:
    image: caddy:2-alpine
    depends_on:
      - vaultwarden
    environment:
      BACKEND: "http://vaultwarden:80"
    ports:
      - "443:443"
    volumes:
      - "./caddy-data:/data"
      - "./caddy-config:/config"
      - "./caddy-etc:/etc/caddy"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost:443/alive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
    x-lawn:
      initFiles:
        - source: "Caddyfile"
          containerPath: "/etc/caddy/Caddyfile"
      environment:
