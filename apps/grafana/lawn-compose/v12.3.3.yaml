x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32

services:
  grafana:
    image: grafana/grafana-oss:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./data:/var/lib/grafana"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              value: admin
            - id: password
              type: field
              source: GF_SECURITY_ADMIN_PASSWORD
              container: grafana
      healthChecks:
        - id: web-ui
          type: http
          path: /api/health
          expectedStatus: 200
      environment:
        GF_SECURITY_ADMIN_USER:
        GF_USERS_ALLOW_SIGN_UP:
        TZ:
