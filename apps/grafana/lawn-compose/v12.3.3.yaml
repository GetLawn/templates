x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
    ANONYMOUS_ACCESS:
      inputType: boolean
      value: false
      weight: 10
      options:
        "true":
          compose:
            services:
              grafana:
                environment:
                  GF_AUTH_ANONYMOUS_ENABLED: "true"
        "false":
          compose:
            services:
              grafana:
                environment:
                  GF_AUTH_ANONYMOUS_ENABLED: "false"
    PUBLIC_SIGNUPS:
      inputType: boolean
      value: false
      weight: 20
      options:
        "true":
          compose:
            services:
              grafana:
                environment:
                  GF_USERS_ALLOW_SIGN_UP: "true"
        "false":
          compose:
            services:
              grafana:
                environment:
                  GF_USERS_ALLOW_SIGN_UP: "false"
    THEME:
      value: system
      weight: 30
      options:
        system:
          weight: 10
          compose:
            services:
              grafana:
                environment:
                  GF_USERS_DEFAULT_THEME: "system"
        dark:
          weight: 20
          compose:
            services:
              grafana:
                environment:
                  GF_USERS_DEFAULT_THEME: "dark"
        light:
          weight: 30
          compose:
            services:
              grafana:
                environment:
                  GF_USERS_DEFAULT_THEME: "light"
    USAGE_STATISTICS:
      inputType: boolean
      value: true
      weight: 40
      options:
        "true":
          compose:
            services:
              grafana:
                environment:
                  GF_ANALYTICS_REPORTING_ENABLED: "true"
        "false":
          compose:
            services:
              grafana:
                environment:
                  GF_ANALYTICS_REPORTING_ENABLED: "false"
    UPDATE_CHECKS:
      inputType: boolean
      value: true
      weight: 50
      options:
        "true":
          compose:
            services:
              grafana:
                environment:
                  GF_ANALYTICS_CHECK_FOR_UPDATES: "true"
                  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "true"
        "false":
          compose:
            services:
              grafana:
                environment:
                  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
                  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"

services:
  grafana:
    image: grafana/grafana-oss:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./data:/var/lib/grafana"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              value: admin
            - id: password
              type: field
              source: GF_SECURITY_ADMIN_PASSWORD
              container: grafana
      healthChecks:
        - id: web-ui
          type: http
          path: /api/health
          expectedStatus: 200
      environment:
        GF_SECURITY_ADMIN_USER:
        TZ:
