x-lawn-compatibility:
  minLawnVersion: 0.2.0

x-lawn:
  variables:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Admin Password"
      description: "Password for the Grafana admin account. Auto-generated during install."

services:
  grafana:
    image: grafana/grafana-oss:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: "${TIMEZONE:-UTC}"
    volumes:
      - "./data:/var/lib/grafana"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: login-credentials
          title: Login Credentials
          style: info
          elements:
            - type: field
              label: Username
              value: admin
            - type: field
              label: Password
              source: GF_SECURITY_ADMIN_PASSWORD
              container: grafana
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /api/health
          expectedStatus: 200
      environment:
        GF_SECURITY_ADMIN_USER:
          description: "Username for the Grafana admin account."
        GF_USERS_ALLOW_SIGN_UP:
          description: "Whether to allow new user self-registration."
        TZ:
          description: "Timezone for Grafana (e.g. America/New_York)."
