id: upsnap
name: UpSnap
tagline: A simple Wake-on-LAN dashboard for your local network
description: |
  UpSnap is a self-hosted Wake-on-LAN web app for managing devices on your local network. It gives you a clean dashboard for waking machines, checking whether they are online, and organizing network devices for quick access.

  **Wake Devices from One Place:**
  Add desktops, servers, NAS devices, and other Wake-on-LAN capable hardware, then wake them from a browser with one click.

  **Status Checks and Discovery:**
  UpSnap can ping devices on a schedule and scan local network ranges to help discover hosts. The template includes configurable polling and scan timeout settings.

  **Automation Friendly:**
  Timed events use cron expressions, so devices can be checked or woken on a schedule. Device shutdown commands are supported by UpSnap, but should only be used on trusted local networks.

  **Private Local Control:**
  UpSnap stores its PocketBase data locally and is intended for private network use. For access away from home, use a VPN rather than exposing it directly to the open web.
