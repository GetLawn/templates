x-lawn:
  compatibility:
    minLawnVersion: 0.6.0

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79
    # Serve the setup wizard and dashboard on the same internal port.
    # Preserve the image's config and work paths when adding --web-addr.
    command:
      - --no-check-update
      - -c
      - /opt/adguardhome/conf/AdGuardHome.yaml
      - -w
      - /opt/adguardhome/work
      - --web-addr
      - 0.0.0.0:80
    volumes:
      - "./conf:/opt/adguardhome/conf"
      - "./work:/opt/adguardhome/work"
    ports:
      - "53:53"
      - "53:53/udp"
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: command
          command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
          intervalSeconds: 10
          timeoutSeconds: 5
          retries: 5
          startPeriodSeconds: 30
      notices:
        - id: setup-wizard-ports
          style: warning
          elements:
            - id: port-config-info
              type: text
