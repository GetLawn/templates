x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.71
    volumes:
      - "./conf:/opt/adguardhome/conf"
      - "./work:/opt/adguardhome/work"
    ports:
      - "3000:3000"
      - "53:53"
      - "53:53/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: http
          path: "/"
          expectedStatus: 200
          followRedirects: true
          intervalSeconds: 10
          timeoutSeconds: 5
          retries: 5
          startPeriodSeconds: 30
      notices:
        - id: setup-wizard-ports
          style: warning
          elements:
            - id: port-config-info
              type: text
