id: adguard-home
name: AdGuard Home
tagline: Network-wide ad and tracker blocking
description: |
  AdGuard Home is a network-wide DNS filtering service. Configure your router or individual devices to use it, and matching advertising, tracking, and malicious domains can be blocked without installing a browser extension on every device.

  **Filter Requests Across Your Network:**
  AdGuard Home compares DNS requests with the blocklists you select. DNS filtering can reduce ads and trackers across configured devices, although it cannot remove content served from the same domains as the sites or apps you use.

  **Protect Your Privacy:**
  Block requests to known tracking domains and review query activity from the local dashboard. Filtering reduces exposure to listed trackers but does not make browsing anonymous.

  **Keep Your Family Safe:**
  Built-in parental controls can block listed adult-content domains and enable supported safe-search modes for configured devices.

  **Beautiful Dashboard:**
  See exactly what's happening on your network with a clean, easy-to-read dashboard. View statistics on blocked queries, top clients, and most-requested domains.

  **Encrypted DNS:**
  Supports modern encrypted DNS protocols, including DNS-over-HTTPS and DNS-over-TLS, for encrypting DNS traffic to compatible upstream resolvers.
