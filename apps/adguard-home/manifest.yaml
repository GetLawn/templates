id: adguard-home
name: AdGuard Home
tagline: Network-wide ad and tracker blocking
description: |
  AdGuard Home is a network-wide ad blocker that protects all your devices at once. Instead of installing ad blockers on every phone, tablet, and computer, you set it up once and every device on your network is protected.

  **Block Ads Everywhere:**
  AdGuard Home works at the DNS level — it intercepts requests to known advertising and tracking domains before they even reach your devices. This means faster page loads, less data usage, and no more annoying ads on any device connected to your network.

  **Protect Your Privacy:**
  Block trackers that follow you across the web. AdGuard Home prevents thousands of known tracking services from collecting data about your browsing habits. Your activity stays private.

  **Keep Your Family Safe:**
  Built-in parental controls let you block adult content and enforce safe search across all devices. Perfect for families with children.

  **Beautiful Dashboard:**
  See exactly what's happening on your network with a clean, easy-to-read dashboard. View statistics on blocked queries, top clients, and most-requested domains.

  **Encrypted DNS:**
  Supports modern encrypted DNS protocols (DNS-over-HTTPS, DNS-over-TLS) to prevent your ISP from snooping on your DNS queries.
