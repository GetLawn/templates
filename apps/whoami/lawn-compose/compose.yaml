x-lawn:
  compatibility:
    minLawnVersion: 0.6.0

services:
  whoami:
    image: traefik/whoami:v1.12.0
    ports:
      - "80"
    x-lawn:
      healthChecks:
        - id: http-api
          type: http
          path: /
          expectedStatus: 200
          intervalSeconds: 10
          timeoutSeconds: 5
          retries: 3
          startPeriodSeconds: 60
