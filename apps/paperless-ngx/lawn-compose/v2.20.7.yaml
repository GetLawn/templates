x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    POSTGRES_PASSWORD:
      source: generatedSecret
      length: 32
    SECRET_KEY:
      source: generatedSecret
      length: 50
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
    DOCUMENT_LANGUAGES:
      inputType: list
      separator: "+"
      value: "eng"
      weight: 10
      availableOptions:
        - eng
        - deu
        - fra
        - spa
        - ita
        - por
        - nld
        - pol
        - rus
        - jpn
        - chi_sim
        - chi_tra
        - kor
        - ara
        - hin
        - tur
        - swe
        - dan
        - nor
        - fin
        - ces
        - ron
        - hun
        - ell
        - heb
        - tha
        - vie
        - ind
        - ukr
        - cat
    LANGUAGE_PACKS:
      inputType: list
      separator: " "
      value: ""
      weight: 20
      availableOptions:
        - eng
        - deu
        - fra
        - spa
        - ita
        - por
        - nld
        - pol
        - rus
        - jpn
        - chi_sim
        - chi_tra
        - kor
        - ara
        - hin
        - tur
        - swe
        - dan
        - nor
        - fin
        - ces
        - ron
        - hun
        - ell
        - heb
        - tha
        - vie
        - ind
        - ukr
        - cat

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # PGDATA must be a subdirectory of the mount point so postgres can
      # create it with correct ownership (postgres user, not host user)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    x-lawn:
      environment:

  redis:
    # Note: No volume mount - redis is used for Celery task queue, not document storage.
    # Pending tasks are lost on restart, but documents (in postgres/media) are safe.
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.7
    depends_on:
      - postgres
      - redis
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PAPERLESS_SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      PAPERLESS_TIME_ZONE: "${TIMEZONE:-UTC}"
      PAPERLESS_OCR_LANGUAGE: "${DOCUMENT_LANGUAGES}"
      PAPERLESS_OCR_LANGUAGES: "${LANGUAGE_PACKS}"
      USERMAP_UID: "${UID:-1000}"
      USERMAP_GID: "${GID:-1000}"
    volumes:
      - "./data:/usr/src/paperless/data"
      - "./media:/usr/src/paperless/media"
      - "./consume:/usr/src/paperless/consume"
      - "./export:/usr/src/paperless/export"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2048M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              value: admin
            - id: password
              type: field
              source: PAPERLESS_ADMIN_PASSWORD
              container: paperless
      environment:
        PAPERLESS_REDIS:
        PAPERLESS_DBHOST:
        PAPERLESS_DBNAME:
        PAPERLESS_DBUSER:
        PAPERLESS_DBPASS:
        PAPERLESS_SECRET_KEY:
        PAPERLESS_ADMIN_USER:
        PAPERLESS_ADMIN_PASSWORD:
        PAPERLESS_TIME_ZONE:
        PAPERLESS_OCR_LANGUAGE:
        PAPERLESS_OCR_LANGUAGES:
        USERMAP_UID:
        USERMAP_GID:
