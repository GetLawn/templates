x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  speedtest:
    image: ghcr.io/librespeed/speedtest:5.5.1
    environment:
      MODE: "standalone"
      TITLE: "LibreSpeed"
      TELEMETRY: "false"
      DISABLE_IPINFO: "true"
      DISTANCE: "km"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    x-lawn:
      healthChecks:
        - id: web-ui
          type: http
          path: /
          expectedStatus: 200
      environment:
        MODE:
        TITLE:
        TELEMETRY:
        DISABLE_IPINFO:
        DISTANCE:
