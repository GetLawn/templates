id: librespeed
name: LibreSpeed
tagline: Self-hosted connection speed test for your home network
description: |
  LibreSpeed is a simple, privacy-respecting speed test you can run on your own Mac. Open it in a browser to measure the connection between that device and your self-hosted LibreSpeed server.

  **Instant Speed Testing:**
  Measure your download speed, upload speed, ping, and jitter in seconds. Results appear in a clean, animated gauge — no account needed, no setup required.

  **Self-Hosted Testing:**
  LibreSpeed runs on your Mac without requiring a public speed-test provider. Test traffic stays between the browser and your server unless you expose the service or configure additional telemetry.

  **Works on Any Device:**
  Access your speed test from any browser on your network — computers, phones, tablets. Works with Safari, Chrome, Firefox, and all modern browsers.

  **Lightweight:**
  LibreSpeed is small and efficient. Results reflect the path between the browser and your server, so a local installation measures local-network performance rather than your internet provider's full connection speed.
