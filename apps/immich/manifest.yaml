id: immich
name: Immich
tagline: Self-hosted photo and video backup
description: |
  A high-performance, self-hosted photo and video management solution. Immich is the privacy-focused alternative to Google Photos — back up, organize, search, and share your memories on your own Mac.

  **Smart and beautiful:**
  Browse your photos on a familiar timeline, search by what's in the picture (like "sunset at the beach"), and let Immich automatically recognize faces and group them for you.

  **Your memories, your control:**
  All your photos and videos stay on your Mac. Back up from your phone automatically using the free iOS and Android apps. No subscriptions, no cloud, no compromises.
