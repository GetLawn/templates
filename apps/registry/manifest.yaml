id: registry
name: Docker Registry
tagline: Private container image registry for your local network
description: |
  Run your own private Docker registry to store and distribute container images on your local network.

  **Why Run a Local Registry:**
  - Push and pull images without internet access
  - Keep proprietary images private and secure
  - Faster image pulls for local development
  - Cache frequently used images from Docker Hub

  **Pull-Through Cache:**
  Configure as a mirror for Docker Hub or other registries. Images are cached locally on first pull, speeding up subsequent pulls and reducing bandwidth. Set the upstream URL in environment variables to enable.

  **Developer Workflow:**
  Build images locally, push them to your registry, and pull them from authorized machines on your network. It can support home labs, development teams, and disconnected environments.

  **Simple to Use:**
  Tag images with the registry address Lawn provides and push them using an OCI-compatible client. Authentication is not enabled by default, so keep the registry on a trusted network or configure appropriate access controls before exposing it.
symbolFallback: shippingbox.fill
category: Development
compatibility:
  minLawnVersion: 0.2.0
