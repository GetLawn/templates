x-lawn:
  compatibility:
    minLawnVersion: 0.2.0

services:
  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - "./registry:/var/lib/registry"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    x-lawn:
      healthChecks:
        - id: registry-api
          type: http
          path: /v2/
          expectedStatus: 200
          intervalSeconds: 10
          timeoutSeconds: 5
          retries: 3
          startPeriodSeconds: 30
      environment:
        REGISTRY_STORAGE_DELETE_ENABLED:
        REGISTRY_PROXY_REMOTEURL:
        REGISTRY_PROXY_USERNAME:
        REGISTRY_PROXY_PASSWORD:
