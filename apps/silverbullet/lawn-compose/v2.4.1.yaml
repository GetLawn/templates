x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32
      displayName: "Admin Password"
      description: "Admin password for SilverBullet. Auto-generated during install."

services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.4.1
    environment:
      TZ: "${TIMEZONE:-UTC}"
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      SB_USER: "admin:${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
    volumes:
      - "./space:/space"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/.ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: login-credentials
          title: Login Credentials
          style: info
          elements:
            - type: field
              label: Username
              source: SB_USER
              container: silverbullet
              separator: ":"
              position: first
            - type: field
              label: Password
              source: SB_USER
              container: silverbullet
              separator: ":"
              position: last
      healthChecks:
        - type: http
          description: Web UI is accessible
          path: /.ping
          expectedStatus: 200
      environment:
        TZ:
          description: "Timezone for SilverBullet (e.g. America/New_York)."
        PUID:
          description: "User ID for file ownership. Set automatically from your Mac user account."
        PGID:
          description: "Group ID for file ownership. Set automatically from your Mac user account."
        SB_USER:
          description: "Login credentials in 'username:password' format. Auto-generated during install."
