x-lawn:
  compatibility:
    minLawnVersion: 0.2.0
  config:
    ADMIN_PASSWORD:
      source: generatedSecret
      length: 32

services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.4.1
    environment:
      TZ: "${TIMEZONE:-UTC}"
      PUID: "${UID:-1000}"
      PGID: "${GID:-1000}"
      SB_USER: "admin:${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
    volumes:
      - "./space:/space"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/.ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    x-lawn:
      notices:
        - id: login-credentials
          style: info
          elements:
            - id: username
              type: field
              source: SB_USER
              container: silverbullet
              separator: ":"
              position: first
            - id: password
              type: field
              source: SB_USER
              container: silverbullet
              separator: ":"
              position: last
      healthChecks:
        - id: web-ui
          type: http
          path: /.ping
          expectedStatus: 200
      environment:
        TZ:
        PUID:
        PGID:
        SB_USER:
